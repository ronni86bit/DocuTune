# DocuTune training configuration.
# All important values are configurable; the Colab notebook and
# docutune/training/train.py read this file.

model:
  name: microsoft/Phi-3-mini-4k-instruct
  # Exact HF revision (branch / tag / commit sha). null = default revision.
  # Recorded in the training manifest for reproducibility.
  revision: null

quantization:
  # QLoRA: 4-bit NF4 with double quantization. Requires CUDA + bitsandbytes.
  # Automatically disabled (with a logged warning) when running on CPU,
  # e.g. for the smoke test.
  enabled: true
  bits: 4
  quant_type: nf4
  use_double_quant: true
  # bfloat16 when supported by the GPU, else float16 (resolved at runtime).
  compute_dtype: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # Canonical, architecture-agnostic attention request. Resolved against the
  # ACTUAL model at runtime (docutune/training/model.py):
  #   - separate attention (e.g. Llama)  -> q_proj, k_proj, v_proj, o_proj
  #   - fused attention (e.g. Phi-3)     -> qkv_proj, o_proj
  # The resolved set is logged and recorded as `target_modules` in the
  # training manifest; any request that cannot be resolved FAILS training
  # (modules are never silently skipped).
  #
  # Design note: PEFT's target_modules="all-linear" was evaluated and
  # deliberately NOT used - it would also adapt the MLP projections
  # (gate/up/down), changing the trainable-parameter surface and the
  # experiment's meaning. Attention-only adapters remain the intended design.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

training:
  output_dir: artifacts/training
  final_adapter_dir: artifacts/adapters/final
  epochs: 3
  learning_rate: 2.0e-4
  weight_decay: 0.01
  # Expressed as a RATIO of total optimizer steps (readable, size-independent).
  # Transformers 5.x removed TrainingArguments(warmup_ratio=...), so the
  # trainer converts this into an exact warmup_steps value from the actual
  # computed step count (see docutune/training/schedule.py).
  warmup_ratio: 0.05
  max_length: 2048
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  eval_strategy: steps
  eval_steps: 25
  save_strategy: steps
  save_steps: 25
  logging_steps: 10
  save_total_limit: 2
  seed: 42

data:
  train_file: data/splits/train.jsonl
  validation_file: data/splits/validation.jsonl
  # The test split is deliberately NOT referenced anywhere in training.
