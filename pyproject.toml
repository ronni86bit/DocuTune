[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docutune"
version = "1.0.0"
description = "Fine-tuned structured resume extraction with reproducible before/after evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DocuTune Authors" }]
keywords = ["llm", "lora", "qlora", "fine-tuning", "information-extraction", "evaluation"]
dependencies = [
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# GPU training (Colab or local GPU box). Not needed for tests or serving.
training = [
    "torch>=2.4,<3",
    "transformers>=4.51,<6",
    "peft>=0.14,<0.22",
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.45,<0.51",
    "matplotlib>=3.8,<4",
]
# FastAPI backend.
serving = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
# Benchmark charts / report generation.
eval = [
    "matplotlib>=3.8,<4",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
include = ["docutune*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Scripts bootstrap sys.path before importing the package.
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# Depends(...) in defaults is the standard FastAPI dependency-injection pattern.
"backend/**" = ["B008"]
