# DocuTune frontend Nginx configuration.
# - serves the built SPA with history-API fallback
# - proxies /api to the FastAPI backend (long timeout: LLM inference is slow)
# - generous body size for pasted resumes

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    client_max_body_size 2m;

    # Backend API (compose service name: backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
